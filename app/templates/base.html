<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UniSecure Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{{ url_for('web.dashboard') }}">UniSecure</a>
    {% if user %}
    <div class="d-flex align-items-center gap-3">
      <a class="nav-link text-light" href="{{ url_for('web.dashboard') }}">Dashboard</a>
      <a class="nav-link text-light" href="{{ url_for('web.courses') }}">Courses</a>
      <span class="badge bg-info text-dark text-uppercase">{{ user.role }}</span>
      <span class="text-light small">{{ user.full_name }}</span>
      <form method="post" action="{{ url_for('web.logout') }}" class="m-0">
        <button class="btn btn-sm btn-outline-light" type="submit">Logout</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
